<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Facebook{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/facebook2010.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">

{% if current_user_id %}
<div id="pageHead" class="clearfix">
    <div class="header-inner">
        <div class="logo-search-container">
            <a href="/home.php" class="fb_logo_logged">facebook</a>
            <form id="navSearch" action="#" method="GET">
                <input type="text" class="inputsearch" name="q" value="" />
                <button type="submit" class="search_btn"></button>
            </form>
        </div>

        <div id="pageNav">
            <ul>
                <li><a href="/profile.php?id={{ current_user_id }}" class="navLink fwb">{{ current_user_name or 'Profile' }}</a></li>
                <li><a href="/home.php" class="navLink">Home</a></li>
                <li><a href="#" class="navLink">Account</a></li>
            </ul>

            <div id="jewelContainer">
                <a href="#" class="jewelButton requests" title="Friend Requests"><span class="jewelCount"><span>2</span></span></a>
                <a href="#" class="jewelButton messages" title="Messages"></a>
                <a href="#" class="jewelButton notifications" title="Notifications"></a>
            </div>

            <a href="{{ url_for('logout') }}" class="logout-link">Log Out</a>
        </div>
    </div>
</div>
{% endif %}

{% block content %}{% endblock %}

<script src="{{ url_for('static', filename='js/fb_core.js') }}"></script>
</body>
</html>
